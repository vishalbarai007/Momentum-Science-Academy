spring.application.name=backend

# --- DYNAMIC DATABASE CONFIG (Uses Docker Env Vars) ---
# Defaults to localhost for local dev if Env Var is missing
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/momentum}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT SECRET ---
app.jwt.secret=${APP_JWT_SECRET:vp1mVGLxZ721N6J3u+O+/nmq4pzlvIdVvGwKZKQ2IF50BjAnhvQKOZ9RmdVKOwABfusmPBJcAq3dZvSiLTezmg==}
app.jwt.expiration-ms=86400000

