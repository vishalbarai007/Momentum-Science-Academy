server {
    listen 80;
    server_name momentumscienceacademy.com www.momentumscienceacademy.com;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name momentumscienceacademy.com www.momentumscienceacademy.com;

    ssl_certificate /etc/letsencrypt/live/momentumscienceacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/momentumscienceacademy.com/privkey.pem;

    # Important: Increase upload limit for student photos/excel data
    client_max_body_size 20M;

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend (Spring Boot)
    location /api/ {
        # Note the trailing slash in /api/ and the proxy_pass
        proxy_pass http://backend:8080/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for longer backend processing (like processing large student lists)
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
    }
}