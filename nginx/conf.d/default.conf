server {
    listen 80;
    server_name momentumscienceacademy.com www.momentumscienceacademy.com;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name momentumscienceacademy.com www.momentumscienceacademy.com;

    ssl_certificate /etc/letsencrypt/live/momentumscienceacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/momentumscienceacademy.com/privkey.pem;

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend (Spring Boot)
    location /api {
        proxy_pass http://backend:8080; # No trailing slash here
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
