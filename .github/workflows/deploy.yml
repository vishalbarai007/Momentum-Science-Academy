name: Deploy to VPS

on:
  push:
    branches: [ main ]  # Trigger on push to main branch

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated to latest stable version

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # 1. Navigate to the project directory
            # If the folder doesn't exist, it clones it; otherwise, it enters it.
            if [ ! -d "momentum-science-academy" ]; then
              git clone https://github.com/vishalbarai007/Momentum-Science-Academy.git momentum-science-academy
            fi
            cd momentum-science-academy 

            # 2. Pull the latest changes from GitHub
            echo "Pulling latest code..."
            git pull origin main

            # 3. Rebuild and restart containers
            # Rebuilds changed services and ensures the network is up
            echo "Rebuilding Docker containers..."
            docker compose up -d --build

            # 4. Clean up unused images to save VPS disk space
            echo "Cleaning up old images..."
            docker image prune -f

      - name: Notify Search Engines (IndexNow)
        # This step runs on the GitHub runner after the SSH deployment is successful
        run: |
          echo "Notifying Bing/IndexNow about sitemap update..."
          curl -k "https://www.bing.com/indexnow?url=https://momentumscienceacademy.com/sitemap.xml&key=${{ secrets.INDEXNOW_KEY }}"